[workspace]
members = [".", "crates/cubeq-api", "crates/cubeq-buildinfo", "crates/cubeq-infra", "crates/cubeq-config", "crates/cubeq-dist", "crates/cubeq-log", "crates/cubeq-tls", "crates/cubeq-relay-proto", "crates/cubeq-spawn", "crates/cubeq-commands", "crates/cubeq-providers", "crates/cubeq-memory", "crates/cubeq-channels", "crates/cubeq-tools", "crates/cubeq-sop-graph", "crates/cubeq-runtime", "crates/cubeq-eval", "crates/cubeq-plugins", "crates/cubeq-plugins/fixtures/tool-fixture", "crates/cubeq-gateway", "crates/cubeq-hardware", "crates/cubeq-tool-call-parser", "crates/cubeq-macros"]
exclude = ["vendor/crossterm-0.29.0"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kahflane/CubeQ"
rust-version = "1.96.0"

[workspace.dependencies]
cubeq-api = { path = "crates/cubeq-api", version = "0.1.1" }
cubeq-buildinfo = { path = "crates/cubeq-buildinfo", version = "0.1.1" }
cubeq-infra = { path = "crates/cubeq-infra", version = "0.1.1" }
cubeq-config = { path = "crates/cubeq-config", version = "0.1.1", default-features = false }
cubeq-dist = { path = "crates/cubeq-dist", version = "0.1.1" }
cubeq-log = { path = "crates/cubeq-log", version = "0.1.1" }
cubeq-tls = { path = "crates/cubeq-tls", version = "0.1.1" }
cubeq-relay-proto = { path = "crates/cubeq-relay-proto", version = "0.1.1" }
cubeq-spawn = { path = "crates/cubeq-spawn", version = "0.1.1" }
cubeq-commands = { path = "crates/cubeq-commands", version = "0.1.1" }
cubeq-providers = { path = "crates/cubeq-providers", version = "0.1.1" }
cubeq-memory = { path = "crates/cubeq-memory", version = "0.1.1" }
cubeq-channels = { path = "crates/cubeq-channels", version = "0.1.1", default-features = false }
cubeq-tools = { path = "crates/cubeq-tools", version = "0.1.1" }
cubeq-sop-graph = { path = "crates/cubeq-sop-graph", version = "0.1.1", default-features = false }
cubeq-runtime = { path = "crates/cubeq-runtime", version = "0.1.1", default-features = false }
cubeq-eval = { path = "crates/cubeq-eval", version = "0.1.1" }
cubeq-plugins = { path = "crates/cubeq-plugins", version = "0.1.1" }
cubeq-gateway = { path = "crates/cubeq-gateway", version = "0.1.1" }
cubeq-hardware = { path = "crates/cubeq-hardware", version = "0.1.1" }
cubeq-tool-call-parser = { path = "crates/cubeq-tool-call-parser", version = "0.1.1" }
cubeq-macros = { path = "crates/cubeq-macros", version = "0.1.1" }
directories = "6.0"
sys-locale = "0.3"
hmac = "0.12"
zeroize = "1.8"

[package]
name = "cubeq"
# Workspace crates are publish = false during microkernel transition.
publish = true
default-run = "cubeq"
version.workspace = true
edition.workspace = true
authors = ["Mohammad Julfikar"]
license.workspace = true
description = "Zero overhead. Zero compromise. 100% Rust. The fastest, smallest AI assistant."
repository.workspace = true
readme = "README.md"
keywords = ["ai", "agent", "cli", "assistant", "chatbot"]
categories = ["command-line-utilities", "api-bindings"]
rust-version.workspace = true
include = [
  "/src/**/*",
  "/build.rs",
  "/Cargo.toml",
  "/Cargo.lock",
  "/LICENSE*",
  "/README.md",
  "/locales/**/*",
]

[[bin]]
name = "cubeq"
path = "src/main.rs"

[[bin]]
name = "cubeq-acp-bridge"
path = "src/bin/cubeq-acp-bridge.rs"
required-features = ["acp-bridge"]

[lib]
name = "cubeq"
path = "src/lib.rs"

[build-dependencies]
cubeq-buildinfo.workspace = true

[dependencies]
# Internal workspace crates — versions and paths declared once in [workspace.dependencies]
cubeq-api.workspace = true
cubeq-spawn.workspace = true
cubeq-infra.workspace = true
cubeq-config = { workspace = true, features = ["clap"] }
cubeq-log.workspace = true
cubeq-providers.workspace = true
cubeq-memory.workspace = true
cubeq-channels = { workspace = true, optional = true }
cubeq-tools = { workspace = true, optional = true }
cubeq-runtime = { workspace = true, optional = true }
cubeq-tls = { workspace = true }
cubeq-eval = { workspace = true, optional = true }
cubeq-plugins = { workspace = true, optional = true }
cubeq-gateway = { workspace = true, optional = true }
cubeq-hardware = { workspace = true, optional = true }
cubeq-tool-call-parser.workspace = true
cubeq-macros.workspace = true
# CLI - minimal and fast
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap-markdown = "0.1"

# Async runtime - feature-optimized for size
tokio = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "process", "io-std", "fs", "signal"] }
tokio-util = { version = "0.7", default-features = false }

# HTTP client - minimal features
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "multipart", "stream", "socks"] }

# Serialization
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

# Config
directories = "6.0"
toml = "1.0"

# Version precedence for the `plugin update` notice about an older version
semver = { version = "1.0", optional = true }

# JSON Schema generation for config export
schemars = { version = "1.2", optional = true }

# Logging - minimal

# URL encoding for web search
urlencoding = "2.1"

# Tarball extraction for binary updates
flate2 = "1"
tar = "0.4"

# Temp files (update pipeline rollback)
tempfile = "3.26"

# Capability-scoped directory handles (beneath/no-follow). Used by the agent-bundle
# export to walk a live, agent-writable workspace without re-opening paths by name.
# Already built through cubeq-runtime and cubeq-tools, which bind their
# workspace reads the same way — zero added compile/binary cost for default builds.
cap-std = "4"
# `follow(FollowSymlinks::No)` and `open_dir_nofollow`, which cap-std itself does not
# expose. The export needs the open to refuse a symlink outright, not merely keep it
# beneath the root: an in-root link would otherwise defeat the bundle's own content
# exclusions. Thin trait layer over the cap-std/cap-primitives already compiled above.
cap-fs-ext = "4"

# Zip extraction (plugin registry, self-update archives)
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2"] }

# Error handling
anyhow = "1.0"

# HMAC for webhook signature verification
sha2 = "0.10"
hex = "0.4"

# Relay claim proofs belong to the CLI; reuse the registration signer implementation.
base64 = { version = "0.22", optional = true }
ring = { version = "0.17", optional = true }

# Async traits
async-trait = "0.1"

# Memory / persistence (migration.rs, behind agent-runtime)
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

# Interactive CLI prompts (memory CLI uses dialoguer unconditionally)
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
console = "0.16"
crossterm = { version = "0.29", optional = true }

# Binary discovery (init system detection)
which = { version = "8.0", optional = true }

# WebSocket client channels (Discord/Lark/DingTalk/Nostr)
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }

# HTTP server (gateway) — replaces raw TCP for proper HTTP/1.1 compliance
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws", "macros"], optional = true }
tower = { version = "0.5", default-features = false, features = ["util"], optional = true }

# rust-embed removed — web dashboard served from filesystem via gateway.web_dist_dir

# Use the blocking HTTP exporter client to avoid Tokio-reactor panics in
# non-Tokio contexts.

# (Linux, macOS, Windows). Android/Termux uses target_os="android" and is excluded.

# Uses whatsapp-rust for Bot and Client, wacore for storage traits, custom rusqlite backend avoids Diesel conflict.

# Unix: the Quickstart checklist measures the terminal behind the descriptor
# it draws on (TIOCGWINSZ). Linux additionally uses it for `desktop --install`,
# which opens candidate `.desktop` entries with O_NONBLOCK|O_NOFOLLOW so a FIFO
# or symlink planted in an XDG data dir cannot block or redirect the read.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Installer/surface metadata: which `[features]` are internal aggregates or
# meta toggles rather than user-selectable rows. This bit is NOT derivable from
# the feature graph (e.g. `embedded-web` and `whatsapp-web` are structurally
# identical single cross-crate refs but one is meta and one is a real row), so
# it lives here in the canonical registry. install.sh and `cargo cmd convert`
# both read this; neither shadows it with its own list.
[package.metadata.cubeq]
# Published CLI archives use this selection across the release target matrix.
# Every archive carries adapters for both runtime tool settings; no second archive.
release_distributions = ["dist"]
non_row_features = [
    "default",
    "default-channels",
    "channels-full",
    "tools-saas",
    "tools-coding-cli",
    "tools-compat",
    "ci-all",
    "fantoccini",
    "landlock",
    "metrics",
    "embedded-web",
]
# Features intentionally added to the lean Cargo defaults for standard
# distribution artifacts. This list is the complete positive policy beyond
# `default`; target-specific exclusions are resolved from the table below.
#
# `plugins-wasm-cranelift` ships the WASM plugin host together with the
# compiler that loads `.wasm` components, the only form the plugin registry
# publishes. Runtime defaults stay closed: the agent loads no installed
# plugin until the operator enables the plugin system (and turns discovery
# on for tools and skills); the CLI's install check, `plugin info` and
# `plugin list --verify` still instantiate a package in a sandboxed store.
# The release workflow executes a plugin from every archive that carries the
# host before it publishes anything of its own.
dist_extra_features = [
    "channel-matrix",
    "channel-lark",
    "channel-git",
    "whatsapp-web",
    "plugins-wasm-cranelift",
    "tools-compat",
]

# Features whose build needs system C libraries or tooling the minimal static
# container image (StageX, no system package manager) does not provide. Excluded
# from the container kitchen-sink (Selection::All) so the all-features image
# builds; still available via source --features or a nix override. Not derivable
# from the feature graph, so it lives in the canonical registry.
container_excluded_features = [
    "voice-wake",
]

# Compatibility exclusions for standard distribution artifacts. Release
# workflows pass only their target triple; feature policy stays here.
#
# Cranelift has no native 32-bit ARM backend. wasmtime would select its Pulley
# interpreter as the compilation target there, and no native ARM32 runner can
# execute an ARM32 archive to prove that, so the two ARM32 archives carry no
# plugin host at all rather than one nobody has run. The experimental Android
# archive stays out until it is a required release asset with a smoke leg of
# its own.
[package.metadata.cubeq.dist_target_exclusions]
aarch64-linux-android = ["whatsapp-web", "plugins-wasm-cranelift"]
arm-unknown-linux-gnueabihf = ["observability-prometheus", "plugins-wasm-cranelift"]
armv7-unknown-linux-gnueabihf = ["observability-prometheus", "plugins-wasm-cranelift"]

[features]
# Every feature that builds without extra source trees is on by default.
# Left out: `embedded-web` (needs a web dashboard build), `dev-sim` (a
# development simulator) and the alternative WASM engines.
default = [
    "agent-runtime",
    "default-channels",
    "acp-bridge",
    "gateway",
    "observability-prometheus",
    "schema-export",
    "ci-all",
    "voice-wake",
]

# The core agent runtime — agent loop, tools, persistence subsystems.
# Without this, you get the kernel: config + providers + memory + CLI chat.
# Channels are opt-in via the lean `default-channels` bundle, `channels-full`,
# or individual `channel-*` features.
agent-runtime = [
    "dep:cubeq-runtime", "dep:cubeq-eval", "dep:cubeq-channels", "dep:cubeq-tools",
    "dep:rusqlite",
    "dep:which",
    "dep:crossterm",
    "dep:tokio-tungstenite",
    "dep:rustls",
    "dep:base64",
    "dep:ring",
]

# Lean channel bundle included in `default`. These channels cover local/editor
# ACP, gateway/webhook ingress, and common first-run external chat/email paths.
default-channels = [
    "channel-acp-server", "channel-webhook",
    "channel-email", "channel-telegram", "channel-discord",
    "channel-filesystem",
]

# Historical broad channel bundle. Preserves the older default channel surface.
channels-full = [
    "default-channels", "cubeq-channels/channels-full", "channel-lark",
    "channel-line",
    "channel-slack", "channel-signal",
    "channel-mattermost", "channel-irc", "channel-imessage",
    "channel-dingtalk", "channel-qq", "channel-bluesky", "channel-git",
    "channel-twitch", "channel-twitter", "channel-reddit", "channel-notion", "channel-mqtt", "channel-amqp",
    "channel-linq", "channel-nextcloud",
    "channel-mochat", "channel-wecom", "channel-wecom-ws", "channel-clawdtalk",
    "channel-whatsapp-cloud", "channel-voice-call",
]

# Native adapters are opt-in for Cargo-default source builds. Standard
# distributions carry their implementations for minimal/full runtime selection.
tools-external = ["cubeq-runtime/tools-external", "cubeq-tools/tools-external"]
# Standard/source adapter bundle; registration still requires [tools].optional.
tools-compat = ["tools-saas", "tools-coding-cli", "tools-external"]
tools-saas = [
    "tool-jira",
    "tool-notion",
    "tool-linkedin",
    "tool-composio",
    "tool-google-workspace",
    "tool-microsoft365",
    "tool-project-intel",
]

# Opt-in tools that delegate to external coding CLIs.
tools-coding-cli = [
    "tool-claude-code",
    "tool-claude-code-runner",
    "tool-codex-cli",
    "tool-gemini-cli",
    "tool-opencode-cli",
]

# Tools — each forwards to cubeq-runtime, which registers it.
tool-jira = ["cubeq-runtime/tool-jira"]
tool-notion = ["cubeq-runtime/tool-notion"]
tool-linkedin = ["cubeq-runtime/tool-linkedin"]
tool-composio = ["cubeq-runtime/tool-composio"]
tool-google-workspace = ["cubeq-runtime/tool-google-workspace"]
tool-microsoft365 = ["cubeq-runtime/tool-microsoft365"]
tool-project-intel = ["cubeq-runtime/tool-project-intel"]
tool-claude-code = ["cubeq-runtime/tool-claude-code"]
tool-claude-code-runner = ["cubeq-runtime/tool-claude-code-runner", "cubeq-gateway?/tool-claude-code-runner"]
tool-codex-cli = ["cubeq-runtime/tool-codex-cli"]
tool-gemini-cli = ["cubeq-runtime/tool-gemini-cli"]
tool-opencode-cli = ["cubeq-runtime/tool-opencode-cli"]

# Major subsystems — each forwards to exactly ONE crate
gateway = [
    "dep:cubeq-gateway",
    "dep:axum", "dep:tower",
]
schema-export = ["dep:schemars", "cubeq-config/schema-export"]
acp-bridge = ["dep:tokio-tungstenite"]

# Channels — each forwards to cubeq-channels.
channel-email = ["cubeq-channels/channel-email", "cubeq-gateway?/channel-email"]
channel-telegram = ["cubeq-channels/channel-telegram"]
channel-lark = ["cubeq-channels/channel-lark"]
channel-nostr = ["cubeq-channels/channel-nostr"]
channel-matrix = ["cubeq-channels/channel-matrix"]
channel-discord = ["cubeq-channels/channel-discord"]
channel-slack = ["cubeq-channels/channel-slack"]
channel-signal = ["cubeq-channels/channel-signal"]
channel-mattermost = ["cubeq-channels/channel-mattermost"]
channel-irc = ["cubeq-channels/channel-irc"]
channel-twitch = ["cubeq-channels/channel-twitch"]
channel-imessage = ["cubeq-channels/channel-imessage"]
channel-dingtalk = ["cubeq-channels/channel-dingtalk"]
channel-qq = ["cubeq-channels/channel-qq"]
channel-bluesky = ["cubeq-channels/channel-bluesky"]
channel-git = ["cubeq-channels/channel-git"]
provider-github = ["cubeq-channels/provider-github"]
provider-gitea = ["cubeq-channels/provider-gitea"]
channel-twitter = ["cubeq-channels/channel-twitter"]
channel-reddit = ["cubeq-channels/channel-reddit"]
channel-notion = ["cubeq-channels/channel-notion"]
channel-mqtt = ["cubeq-channels/channel-mqtt"]
channel-filesystem = ["cubeq-channels/channel-filesystem"]
channel-amqp = ["cubeq-channels/channel-amqp"]
channel-linq = ["cubeq-channels/channel-linq", "cubeq-gateway?/channel-linq"]
channel-nextcloud = ["cubeq-channels/channel-nextcloud", "cubeq-gateway?/channel-nextcloud"]
channel-mochat = ["cubeq-channels/channel-mochat"]
channel-wechat = ["cubeq-channels/channel-wechat", "cubeq-gateway?/channel-wechat"]
channel-wecom = ["cubeq-channels/channel-wecom"]
channel-wecom-ws = ["cubeq-channels/channel-wecom-ws"]
channel-clawdtalk = ["cubeq-channels/channel-clawdtalk"]
channel-webhook = ["cubeq-channels/channel-webhook"]
channel-acp-server = ["cubeq-channels/channel-acp-server", "cubeq-gateway?/channel-acp-server"]
channel-whatsapp-cloud = ["cubeq-channels/channel-whatsapp-cloud", "cubeq-gateway?/channel-whatsapp-cloud"]
channel-voice-call = ["cubeq-channels/channel-voice-call"]
channel-line = ["cubeq-channels/channel-line"]
# Feishu uses the same channel implementation as Lark; `use_feishu = true`
# selects Feishu endpoints at runtime.
channel-feishu = ["channel-lark"]
whatsapp-web = ["cubeq-channels/whatsapp-web", "cubeq-gateway?/whatsapp-web"]
voice-wake = ["cubeq-channels/voice-wake"]
memory-postgres = ["cubeq-memory/memory-postgres"]

# Backends and platform flags — each forwards to ONE crate
observability-prometheus = [
    "cubeq-runtime/observability-prometheus",
    "cubeq-gateway/observability-prometheus",
]
observability-otel = ["cubeq-runtime/observability-otel"]
hardware = ["dep:cubeq-hardware", "cubeq-hardware/hardware"]
peripheral-rpi = ["dep:cubeq-hardware", "cubeq-hardware/peripheral-rpi"]
# Forwards `cubeq-hardware/dev-sim`: extends the serial allow-list with
# `/tmp/zc-sim-*` for hardware-free simulation. Off by default; opt-in for the
# simulator and demo.
dev-sim = ["dep:cubeq-hardware", "cubeq-hardware/dev-sim"]
sandbox-landlock = ["cubeq-runtime/sandbox-landlock"]
sandbox-bubblewrap = ["cubeq-runtime/sandbox-bubblewrap"]
browser-native = ["tools-external", "cubeq-tools/browser-native"]
computer-use = ["agent-runtime", "tools-external", "cubeq-runtime/computer-use"]
plugins-wasm = [
    "dep:cubeq-plugins",
    "dep:semver",
    "cubeq-runtime/plugins-wasm",
    "cubeq-gateway?/plugins-wasm",
]
probe = ["dep:cubeq-hardware", "cubeq-hardware/probe"]
webauthn = ["cubeq-runtime/webauthn", "cubeq-gateway?/webauthn"]
embedded-web = ["cubeq-gateway/embedded-web"]

# Backward-compatible aliases
fantoccini = ["browser-native"]
landlock = ["sandbox-landlock"]
metrics = ["observability-prometheus"]

# WASM plugin execution choice:
#
# Omit all three of the following features and there will not be any WASM plugin
# support at all — no plugin runtime, no WASM dependencies, and the plugin ABI
# surface will be unavailable in the agent runtime.
#
# Each feature adds a WASM execution strategy; enable the smallest set your targets
# need. `plugins-wasm-runtime-only` is implied by the other two. Every backend
# feature also implies `plugins-wasm` itself, so enabling any execution strategy
# always carries the plugin host and its CLI surface; a backend-only build
# cannot silently produce a binary without the `plugin` subcommand.
#
# Only `plugins-wasm-cranelift` includes a compiler. A build without it loads
# precompiled `.cwasm` components only, pinned to this exact wasmtime version,
# and refuses the `.wasm` components the plugin registry publishes.
#
# - `plugins-wasm-runtime-only`: Fastest startup for plugins and smallest binary size,
#   but requires plugin authors to compile a specific version for each target
#   architecture (`.cwasm` files instead of `.wasm`) unless `plugins-wasm-cranelift`
#   is also enabled.
# - `plugins-wasm-cranelift`: Add the Cranelift compiler on top of the runtime,
#   which compiles `.wasm` plugins on the host machine at the cost of a larger
#   binary. Standard distribution artifacts carry it on the 64-bit desktop and
#   server targets (see `dist_extra_features` and `dist_target_exclusions`
#   above). Cranelift has no native 32-bit ARM backend; on such hosts wasmtime
#   selects its Pulley interpreter as the compilation target by itself.
# - `plugins-wasm-pulley`: Compiles in wasmtime's Pulley interpreter. CubeQ
#   never selects Pulley as a compilation target, so on hosts with a native
#   Cranelift backend (every 64-bit release target) the feature changes
#   nothing: alone it behaves like `plugins-wasm-runtime-only` and loads
#   host-native `.cwasm` files, and with `plugins-wasm-cranelift` it compiles
#   native code. On hosts without a native backend, wasmtime targets Pulley
#   whether or not this feature is set. Pulley runs slower than native code.
plugins-wasm-runtime-only = ["plugins-wasm", "cubeq-plugins/plugins-wasmtime"]
plugins-wasm-cranelift    = ["plugins-wasm", "cubeq-plugins/plugins-wasm-cranelift", "cubeq-runtime/plugins-wasm-cranelift"]
plugins-wasm-pulley       = ["plugins-wasm", "cubeq-plugins/plugins-wasm-pulley"]

# CI meta-feature
ci-all = [
    "agent-runtime",
    "channels-full",
    "channel-nostr", "channel-matrix", "whatsapp-web", "channel-wechat",
    "observability-prometheus", "observability-otel",
    "hardware", "peripheral-rpi",
    "sandbox-landlock", "sandbox-bubblewrap",
    "browser-native", "computer-use", "probe",
    "plugins-wasm", "plugins-wasm-cranelift",
    "webauthn", "memory-postgres",
    "tools-saas", "tools-coding-cli", "tools-external",
]

[profile.dev]
incremental = true
opt-level = 0

[profile.release]
opt-level = "z"      # Optimize for size
lto = "fat"          # Maximum cross-crate optimization for smaller binaries
codegen-units = 1    # Serialized codegen for low-memory devices (e.g., Raspberry Pi 3 with 1GB RAM)
                     # Higher values (e.g., 8) compile faster but require more RAM during compilation
strip = true          # Remove debug symbols
panic = "abort"      # Reduce binary size

[profile.release-fast]
inherits = "release"
codegen-units = 8    # Parallel codegen for faster builds on powerful machines (16GB+ RAM recommended)
                     # Use: cargo build --profile release-fast

[profile.ci]
inherits = "release"
lto = "thin"         # Much faster than fat LTO; still catches release-mode issues
codegen-units = 16   # Full parallelism for CI runners

[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
# Enables the runtime crate's test-only `ScopedToolRegistry::from_raw_for_test`
# so this package's integration-test helpers can mint the now-sealed engine tool
# registry. dev-dependency only: resolver v2 keeps `test-util` out of the shipped
# binary build, so the assemble()-only seal holds in production.
cubeq-runtime = { workspace = true, features = ["test-util"] }
tempfile = "3.26"
# The channel WebSocket lifecycle e2e serves a loopback WebSocket peer. The
# normal dependency is optional, so the test names its own.
tokio-tungstenite = "0.29"
wiremock = "0.6"
scopeguard = "1.2"
rcgen = "0.13"
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
# Also used by tests in builds without the relay CLI feature.
base64 = "0.22"
hmac = "0.12"
parking_lot = "0.12"
regex = "1.10"
uuid = { version = "1.22", default-features = false, features = ["v4", "std"] }

# Temporary upstream terminal EOF/error backport. See vendor/crossterm-0.29.0/PATCH.md.
[patch.crates-io]
crossterm = { path = "vendor/crossterm-0.29.0" }
